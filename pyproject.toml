[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "ade-integrity"
version = "0.1.0"
description = "Portable standard-library integrity checks for ADE artifacts"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
[tool.setuptools.packages.find]
where = ["."]
include = ["ade_integrity*"]
namespaces = false
